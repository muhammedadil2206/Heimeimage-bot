services:
  # ============================================
  # COMBINED SERVICE (Backend + Frontend)
  # ============================================
  # Single service that serves both API and React frontend
  # Render will automatically:
  # - Assign URL: https://heimage-bot.onrender.com
  # - Set PORT environment variable automatically
  # - Auto-deploy on every GitHub push (if enabled)
  # ============================================
  - type: web
    name: heimage-bot
    env: node
    plan: free
    buildCommand: cd client && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANT: Add these in Render Dashboard (one-time setup):
      # - MONGO_URI: Your MongoDB connection string
      # - JWT_SECRET: Random secret (generate: openssl rand -hex 32)
      # - CLIPDROP_API_KEY: Your Clipdrop API key
      # Note: CLIENT_URL and VITE_API_BASE_URL not needed - same domain!

